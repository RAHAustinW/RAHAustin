<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Team Directory — RAH</title>
<style>
  :root{
    --teal:#008996; --teal-dark:#00646E; --teal-tint:#E4F3F4;
    --orange:#E76727; --orange-tint:#FDEEE6;
    --ink:#1D2327; --ink-soft:#5B6469; --ink-mute:#8A9296;
    --line:#E2E6E8; --bg:#F6F8F9; --card:#FFFFFF; --red:#B23A24; --red-tint:#FBE7E4;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;}
  button,input,select{font-family:var(--sans);}

  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .back{color:var(--teal-dark);text-decoration:none;font-size:13px;font-weight:600;}
  .back:hover{text-decoration:underline;}
  .switch{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 14px 5px 6px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .switch .knob{width:30px;height:18px;border-radius:9px;background:#C9D0D3;position:relative;transition:background .15s;}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch[aria-checked="true"]{color:var(--teal-dark);border-color:var(--teal);background:var(--teal-tint);}
  .switch[aria-checked="true"] .knob{background:var(--teal);}
  .switch[aria-checked="true"] .knob::after{left:14px;}

  .hero{background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 100%);padding:36px 32px 28px;text-align:center;}
  .hero h1{color:#fff;font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .hero p{color:#DCF1F2;font-size:14.5px;margin:0 0 22px;}
  .search-wrap{max-width:480px;margin:0 auto;}
  #search{width:100%;padding:13px 18px;border:none;border-radius:10px;font-size:14px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.15);}
  #search:focus{outline:2px solid var(--orange);outline-offset:1px;}

  main{max-width:1320px;margin:0 auto;padding:28px 32px 64px;}

  .banner{display:none;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--orange-tint);border:1px solid #F4C9B3;color:#7A3410;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;}
  .banner.show{display:flex;}
  .banner.info{background:var(--teal-tint);border-color:#BFE0E3;color:var(--teal-dark);}
  .banner .btns{display:flex;gap:8px;flex-wrap:wrap;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:18px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip:hover{border-color:var(--teal);color:var(--teal-dark);}
  .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip .n{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-left:4px;}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-mute);margin-right:4px;}
  #sortSel{display:none;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:12.5px;background:var(--card);}

  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn.primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
  .btn.warn{background:var(--orange);border-color:var(--orange);color:#fff;}
  .btn.warn:hover{background:#C9531A;border-color:#C9531A;color:#fff;}
  .btn.sm{padding:4px 9px;font-size:11.5px;}
  .btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-tint);}
  .add-btn{display:none;}
  body.edit .add-btn{display:inline-block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(15,40,45,.03);}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;background:var(--teal-tint);padding:0;white-space:nowrap;}
  th .sort{width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:10px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-dark);}
  th .sort .arr{display:inline-block;width:10px;color:var(--orange);}
  th.plain{padding:10px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-dark);}
  td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top;}
  td:nth-child(3),td:nth-child(4),td:nth-child(6),td:nth-child(7){white-space:nowrap;}
  .col-act{width:1%;white-space:nowrap;}
  tbody tr:hover td{background:#FAFCFC;}
  td a{color:var(--teal-dark);text-decoration:none;}
  td a:hover{text-decoration:underline;}
  .nm{font-weight:600;}
  .ext{font-family:var(--mono);}
  .tri{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .dim{color:var(--ink-mute);}
  .act-wrap{display:flex;gap:6px;}
  body:not(.edit) .col-act{display:none;}
  .empty{padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:14px;}

  dialog{border:none;border-radius:14px;padding:0;width:min(540px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.28);color:var(--ink);}
  dialog::backdrop{background:rgba(20,35,40,.5);}
  .dlg-head{padding:18px 22px 12px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;}
  .dlg-body{padding:16px 22px 6px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .dlg-body .full{grid-column:1 / -1;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  label .req{color:var(--orange);}
  input[type=text],input[type=email],input[type=date]{width:100%;padding:9px 11px;border:1px solid #CBD2D5;border-radius:7px;font-size:13.5px;color:var(--ink);background:#fff;}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  .hint{font-size:11.5px;color:var(--ink-mute);margin-top:3px;}
  .err{display:none;grid-column:1 / -1;background:var(--red-tint);color:var(--red);border-radius:7px;padding:8px 11px;font-size:12.5px;font-weight:600;}
  .err.show{display:block;}
  .dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100vw - 32px);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{max-width:1320px;margin:0 auto;padding:0 32px 40px;color:var(--ink-soft);font-size:12px;text-align:center;}
  footer .mono{font-family:var(--mono);}

  @media (max-width:820px){
    .topbar{padding:12px 16px;} .hero{padding:28px 16px 22px;} main{padding:20px 16px 56px;} footer{padding:0 16px 32px;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{border-top:1px solid var(--line);padding:12px 14px;}
    tbody tr:first-child{border-top:none;}
    td{border:none;padding:3px 0;display:flex;gap:10px;white-space:normal !important;}
    tbody tr:hover td{background:none;}
    td::before{content:attr(data-label);flex:0 0 88px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-mute);padding-top:3px;}
    td.name-cell{font-size:15px;padding-bottom:5px;} td.name-cell::before{display:none;}
    #sortSel{display:inline-block;}
    .dlg-body{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../../">← Back to RAH</a>
  <button class="switch" id="editToggle" role="switch" aria-checked="false"><span class="knob"></span><span>Edit mode</span></button>
</header>

<section class="hero">
  <h1>Team Directory</h1>
  <p>Active staff at Right at Home Central Texas — extensions, work emails and Trillian users</p>
  <div class="search-wrap"><input id="search" type="search" placeholder="Search by name, title, extension, email…" autocomplete="off" aria-label="Search the team directory"></div>
</section>

<main>
  <div class="banner" id="banner" role="status"></div>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filter by office"></div>
    <div class="tools">
      <span class="count" id="count"></span>
      <select id="sortSel" aria-label="Sort by">
        <option value="name">Sort: Name</option><option value="title">Sort: Title</option><option value="ext">Sort: Extension</option>
        <option value="office">Sort: Office</option><option value="start">Sort: Start date</option>
      </select>
      <button class="btn" id="csvBtn" type="button">Export CSV</button>
      <button class="btn primary add-btn" id="addBtn" type="button">+ Add person</button>
    </div>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th aria-sort="none"><button class="sort" data-key="name">Name<span class="arr"></span></button></th>
          <th aria-sort="none"><button class="sort" data-key="title">Title<span class="arr"></span></button></th>
          <th aria-sort="none"><button class="sort" data-key="ext">Ext.<span class="arr"></span></button></th>
          <th class="plain">Email</th>
          <th aria-sort="none"><button class="sort" data-key="office">Office / Location<span class="arr"></span></button></th>
          <th aria-sort="none"><button class="sort" data-key="start">Start date<span class="arr"></span></button></th>
          <th class="plain">Trillian user</th>
          <th class="plain col-act"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">No one matches your search.</div>
  </div>
</main>

<footer>
  <div class="mono" id="stamp"></div>
</footer>

<dialog id="dlg">
  <form id="form" novalidate>
    <div class="dlg-head" id="dlgTitle">Add person</div>
    <div class="dlg-body">
      <div class="full"><label for="f-name">Full name <span class="req">*</span></label><input type="text" id="f-name" autocomplete="off"></div>
      <div class="full"><label for="f-title">Title</label><input type="text" id="f-title" autocomplete="off"></div>
      <div><label for="f-ext">Extension</label><input type="text" id="f-ext" inputmode="numeric" autocomplete="off"></div>
      <div><label for="f-start">Start date</label><input type="date" id="f-start"></div>
      <div class="full"><label for="f-email">Work email</label><input type="email" id="f-email" autocomplete="off"></div>
      <div class="full"><label for="f-office">Office / Location</label><input type="text" id="f-office" autocomplete="off"><div class="hint">Separate parts with “ / ”, e.g. Philippines / Austin</div></div>
      <div class="full"><label for="f-trillian">Trillian user</label><input type="text" id="f-trillian" autocomplete="off"></div>
      <div class="err" id="formErr" role="alert"></div>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var FIELDS = ['name','title','ext','email','office','start','trillian'];
  var LS_KEY = 'rah-team-directory-draft-v1';
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var clone = function(o){ return JSON.parse(JSON.stringify(o)); };

  var published = null;   // what team.json currently says
  var people = [];        // working copy (published + this browser's draft)
  var editMode = false, sortKey = 'name', sortDir = 1, filter = 'All', query = '';
  var editingId = null, usedFallback = false;

  /* ---------- draft storage (never throws) ---------- */
  function readDraft(){ try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
  function writeDraft(d){ try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch(e){} }
  function clearDraft(){ try { localStorage.removeItem(LS_KEY); } catch(e){} }

  /* ---------- helpers ---------- */
  function tokens(office){ return (office || '').split('/').map(function(t){ return t.trim(); }).filter(Boolean); }
  function fmtDate(iso){ if(!iso) return ''; var p = iso.split('-'); return p[1] + '/' + p[2] + '/' + p[0]; }
  function slug(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'person'; }
  function uniqueId(name){ var base = slug(name), id = base, i = 2; while(people.some(function(p){ return p.id === id; })) id = base + '-' + (i++); return id; }
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 3200); }

  function diff(){
    var pub = {}, cur = {}, added = 0, removed = 0, edited = 0;
    published.people.forEach(function(p){ pub[p.id] = p; });
    people.forEach(function(p){ cur[p.id] = p; });
    people.forEach(function(p){
      if(!pub[p.id]) added++;
      else if(FIELDS.some(function(f){ return (pub[p.id][f] || '') !== (p[f] || ''); })) edited++;
    });
    published.people.forEach(function(p){ if(!cur[p.id]) removed++; });
    return { added: added, removed: removed, edited: edited, total: added + removed + edited };
  }
  function persist(){
    if(diff().total === 0) clearDraft(); else writeDraft({ base: published.updated, people: people });
  }

  /* ---------- load ---------- */
  function valid(d){ return d && Array.isArray(d.people) && d.people.every(function(p){ return p && p.id && p.name; }); }
  function load(){
    var attempt = (typeof fetch === 'function')
      ? fetch('team.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      : Promise.reject(new Error('no fetch'));
    attempt.then(function(d){ if(!valid(d)) throw new Error('bad json'); return d; })
      .catch(function(){ usedFallback = true; return JSON.parse($('#fallback').textContent); })
      .then(function(d){
        published = d; people = clone(d.people);
        var dr = readDraft();
        if(dr && dr.base === d.updated && valid({ people: dr.people })) people = dr.people;
        else if(dr){ clearDraft(); setTimeout(function(){ toast('A newer directory was published — your old local draft was cleared.'); }, 400); }
        render();
      });
  }

  /* ---------- render ---------- */
  function visible(){
    var q = query.trim().toLowerCase();
    return people.filter(function(p){
      if(filter !== 'All' && tokens(p.office).indexOf(filter) === -1) return false;
      if(!q) return true;
      return FIELDS.concat(['startFmt']).some(function(f){ return String(f === 'startFmt' ? fmtDate(p.start) : (p[f] || '')).toLowerCase().indexOf(q) !== -1; });
    });
  }
  function cmp(a, b){
    var x = a[sortKey] || '', y = b[sortKey] || '';
    if(!x && !y) return a.name.localeCompare(b.name);
    if(!x) return 1; if(!y) return -1;            // blanks always last
    var r = sortKey === 'ext' ? (parseInt(x,10) - parseInt(y,10)) : String(x).localeCompare(String(y), undefined, { sensitivity: 'base' });
    return (r || a.name.localeCompare(b.name)) * (sortKey === 'ext' || true ? sortDir : 1);
  }
  function renderChips(){
    var counts = {}; people.forEach(function(p){ tokens(p.office).forEach(function(t){ counts[t] = (counts[t] || 0) + 1; }); });
    var names = Object.keys(counts).sort(function(a,b){ return a.localeCompare(b); });
    if(filter !== 'All' && !counts[filter]) filter = 'All';
    var html = ['All'].concat(names).map(function(n){
      var c = n === 'All' ? people.length : counts[n];
      return '<button class="chip" type="button" data-f="' + esc(n) + '" aria-pressed="' + (filter === n) + '">' + esc(n) + '<span class="n">' + c + '</span></button>';
    }).join('');
    $('#chips').innerHTML = html;
  }
  function renderTable(){
    var list = visible().sort(cmp);
    $('#rows').innerHTML = list.map(function(p){
      var dash = '<span class="dim">—</span>';
      return '<tr data-id="' + esc(p.id) + '">' +
        '<td class="name-cell"><span class="nm">' + esc(p.name) + '</span>' + '</td>' +
        '<td data-label="Title">' + (esc(p.title) || dash) + '</td>' +
        '<td data-label="Ext." class="ext">' + (esc(p.ext) || dash) + '</td>' +
        '<td data-label="Email">' + (p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : dash) + '</td>' +
        '<td data-label="Office">' + (esc(p.office) || dash) + '</td>' +
        '<td data-label="Started">' + (p.start ? esc(fmtDate(p.start)) : dash) + '</td>' +
        '<td data-label="Trillian" class="tri">' + (esc(p.trillian) || dash) + '</td>' +
        '<td class="col-act"><div class="act-wrap"><button class="btn sm" type="button" data-act="edit">Edit</button><button class="btn sm danger" type="button" data-act="del">Remove</button></div></td>' +
      '</tr>';
    }).join('');
    $('#empty').style.display = list.length ? 'none' : 'block';
    $('#count').textContent = list.length === people.length ? people.length + ' people' : list.length + ' of ' + people.length;
    document.querySelectorAll('th[aria-sort]').forEach(function(th){
      var k = th.querySelector('.sort').dataset.key, on = k === sortKey;
      th.setAttribute('aria-sort', on ? (sortDir === 1 ? 'ascending' : 'descending') : 'none');
      th.querySelector('.arr').textContent = on ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
    });
    $('#sortSel').value = sortKey;
  }
  function renderBanner(){
    var b = $('#banner'), d = diff();
    if(d.total > 0){
      var parts = []; if(d.added) parts.push(d.added + ' added'); if(d.edited) parts.push(d.edited + ' edited'); if(d.removed) parts.push(d.removed + ' removed');
      b.className = 'banner show';
      b.innerHTML = '<span><strong>' + d.total + ' unpublished change' + (d.total > 1 ? 's' : '') + '</strong> (' + parts.join(', ') + ') — saved in this browser only. To publish: download <span style="font-family:var(--mono)">team.json</span> and upload it to GitHub in <span style="font-family:var(--mono)">docs/tools/team-directory/</span>.</span>' +
        '<span class="btns"><button class="btn warn" type="button" id="dlBtn">Download team.json</button><button class="btn" type="button" id="discardBtn">Discard changes</button></span>';
    } else if(editMode){
      b.className = 'banner show info';
      b.innerHTML = '<span><strong>Edit mode.</strong> Add, edit or remove people. Changes stay in this browser until you publish them by downloading <span style="font-family:var(--mono)">team.json</span> and uploading it to GitHub.</span>';
    } else { b.className = 'banner'; b.innerHTML = ''; }
    $('#stamp').textContent = usedFallback ? 'Showing built-in copy (team.json not found)' : 'Directory updated ' + String(published.updated).slice(0,10);
  }
  function render(){ renderChips(); renderTable(); renderBanner(); }

  /* ---------- export ---------- */
  function download(name, type, text){
    var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: type }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  function downloadJson(){
    var out = { updated: new Date().toISOString(), people: people.map(function(p){ var o = { id: p.id }; FIELDS.forEach(function(f){ o[f] = p[f] || ''; }); return o; }) };
    download('team.json', 'application/json', JSON.stringify(out, null, 2) + '\n');
    toast('team.json downloaded — now upload it to docs/tools/team-directory/ on GitHub.');
  }
  function downloadCsv(){
    var head = ['Name','Title','Extension','Email','Office / Location','Start Date','Trillian User'];
    var q = function(v){ v = String(v || ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [head.map(q).join(',')].concat(people.map(function(p){ return [p.name,p.title,p.ext,p.email,p.office,fmtDate(p.start),p.trillian].map(q).join(','); }));
    download('rah-team-directory.csv', 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n') + '\r\n');
  }

  /* ---------- add / edit / remove ---------- */
  function openForm(id){
    editingId = id || null;
    var p = id ? people.filter(function(x){ return x.id === id; })[0] : {};
    $('#dlgTitle').textContent = id ? 'Edit person' : 'Add person';
    FIELDS.forEach(function(f){ $('#f-' + f).value = p[f] || ''; });
    $('#formErr').className = 'err'; $('#formErr').textContent = '';
    $('#dlg').showModal();
    $('#f-name').focus();
  }
  function validate(v){
    if(!v.name) return 'Name is required.';
    var dupName = people.filter(function(p){ return p.id !== editingId && p.name.toLowerCase() === v.name.toLowerCase(); })[0];
    if(dupName) return v.name + ' is already in the directory.';
    if(v.ext && !/^\d{3,5}$/.test(v.ext)) return 'Extension should be 3–5 digits (e.g. 1028).';
    var dupExt = v.ext && people.filter(function(p){ return p.id !== editingId && p.ext === v.ext; })[0];
    if(dupExt) return 'Extension ' + v.ext + ' already belongs to ' + dupExt.name + '.';
    if(v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return 'That email address doesn’t look right.';
    return '';
  }
  function saveForm(e){
    e.preventDefault();
    var v = {}; FIELDS.forEach(function(f){ v[f] = $('#f-' + f).value.trim(); });
    v.email = v.email.toLowerCase();
    v.office = tokens(v.office).join(' / ');
    var msg = validate(v);
    if(msg){ var el = $('#formErr'); el.textContent = msg; el.className = 'err show'; return; }
    if(editingId){
      var p = people.filter(function(x){ return x.id === editingId; })[0];
      FIELDS.forEach(function(f){ p[f] = v[f]; });
      toast(v.name + ' updated.');
    } else {
      v.id = uniqueId(v.name); people.push(v);
      toast(v.name + ' added.');
    }
    $('#dlg').close(); persist(); render();
  }
  function removePerson(id){
    var p = people.filter(function(x){ return x.id === id; })[0]; if(!p) return;
    if(!confirm('Remove ' + p.name + ' from the directory?')) return;
    people = people.filter(function(x){ return x.id !== id; });
    persist(); render(); toast(p.name + ' removed.');
  }

  /* ---------- events ---------- */
  $('#search').addEventListener('input', function(e){ query = e.target.value; renderTable(); });
  $('#chips').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if(!b) return; filter = b.dataset.f; renderChips(); renderTable(); });
  document.querySelector('thead').addEventListener('click', function(e){
    var b = e.target.closest('.sort'); if(!b) return;
    if(sortKey === b.dataset.key) sortDir = -sortDir; else { sortKey = b.dataset.key; sortDir = 1; }
    renderTable();
  });
  $('#sortSel').addEventListener('change', function(e){ sortKey = e.target.value; sortDir = 1; renderTable(); });
  $('#rows').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var id = b.closest('tr').dataset.id;
    if(b.dataset.act === 'edit') openForm(id); else removePerson(id);
  });
  $('#editToggle').addEventListener('click', function(){
    editMode = !editMode; document.body.classList.toggle('edit', editMode);
    this.setAttribute('aria-checked', String(editMode)); renderBanner();
  });
  $('#addBtn').addEventListener('click', function(){ openForm(null); });
  $('#csvBtn').addEventListener('click', downloadCsv);
  $('#form').addEventListener('submit', saveForm);
  $('#cancelBtn').addEventListener('click', function(){ $('#dlg').close(); });
  $('#banner').addEventListener('click', function(e){
    if(e.target.id === 'dlBtn') downloadJson();
    if(e.target.id === 'discardBtn' && confirm('Discard all unpublished changes in this browser?')){
      people = clone(published.people); clearDraft(); render(); toast('Changes discarded.');
    }
  });

  load();
})();
</script>
